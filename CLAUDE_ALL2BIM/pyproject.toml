[project]
name = "all2bim"
version = "0.1.0"
description = "Pipeline local/open source: nube de puntos (LAS) -> modelo interno validable -> IFC -> RVT"
requires-python = ">=3.10"
dependencies = ["numpy", "laspy", "ifcopenshell"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
all2bim = "all2bim.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["all2bim"]
